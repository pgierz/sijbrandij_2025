name: Test Notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: sijbrandij_2025

      - name: Install papermill
        run: mamba install -y papermill

      - name: Cache Zenodo data
        uses: actions/cache@v4
        id: cache-data
        with:
          path: data
          key: zenodo-15497082

      - name: Download data from Zenodo
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          echo "y" | ./download-data.sh

      - name: Run notebooks with papermill
        run: |
          set -e
          for notebook in scripts/*.ipynb; do
            echo "========================================"
            echo "Running: ${notebook}"
            echo "========================================"
            papermill "${notebook}" /dev/null --cwd scripts/
          done
